<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the fullscreen reader paint under the notch and
         home indicator; the bars inside it pad with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Secret — คลังความรู้ส่วนตัว</title>
    <meta name="theme-color" content="#0a0f1f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's display mode: these are what make a launch
         from the home screen open on its own, without Safari's address bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Secret" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Wake the API before React has even been parsed. The server sleeps on
      // Render's free tier and needs ~30s to come back; starting that clock
      // here overlaps it with the bundle download instead of running after it.
      // The response is irrelevant — reaching the server is the whole point —
      // so CORS or network failures are deliberately swallowed.
      (function () {
        var api = "%VITE_API_URL%";
        if (!api || api.charAt(0) === "%") return;
        try {
          fetch(api + "/health", { cache: "no-store", credentials: "omit" }).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ivory">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
