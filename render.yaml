services:
  - type: web
    name: astro-library-hub-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start --workspace server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: UPLOAD_RAW_MAX_BYTES
        value: "314572800"
      - key: AI_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # OCR reads text off scanned PDFs and image posters. It is the heaviest
      # work this server does and this is the free plan, so both keys are set
      # here rather than left to their defaults: flipping OCR_PROVIDER to
      # "none" turns it off from the dashboard alone, with no redeploy.
      - key: OCR_PROVIDER
        value: tesseract
      # Lower than the 60MB default. OCR holds one page image at a time, but a
      # file this size on half a CPU is already a quarter-hour of work nobody
      # is waiting for, and the instance has 512MB to share with the site.
      - key: OCR_MAX_BYTES
        value: "41943040"
